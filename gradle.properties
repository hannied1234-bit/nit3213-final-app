# Project-wide Gradle settings.

# Memory available to the Gradle daemon during builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the AndroidX libraries rather than the old support libraries.
android.useAndroidX=true

# Follow the official Kotlin code style.
kotlin.code.style=official

# Each module's R class only contains its own resources, which keeps builds faster.
android.nonTransitiveRClass=true
